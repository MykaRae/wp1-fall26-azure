services:
  api:
    image: ${API_IMAGE:-wp1-api:local}
    build: ./api
    ports: ["8080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Host: db
      Database__Port: 5432
      Database__Name: student_db
      Database__Username: postgres
      Database__Password: ${POSTGRES_PASSWORD:-localdevpassword123}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
