# Each service has an independent image name for local builds and CI pushes.
services:
  frontend:
    image: ${FRONTEND_IMAGE:-wp1-frontend:local}
    build: ./frontend
    ports: ["8080:8080"]
    environment:
      ApiBaseUrl: http://api:8080
  api:
    image: ${API_IMAGE:-wp1-api:local}
    build: ./api
    ports: ["8081:8080"]
