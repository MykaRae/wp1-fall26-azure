# Reference only: students adapt this into .github/workflows/deploy.yml.
name: Build and deploy my application
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: wp1-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      CONTAINER_ENVIRONMENT: ${{ vars.CONTAINER_ENVIRONMENT }}
      FRONTEND_APP: ${{ vars.FRONTEND_APP }}
      API_APP: ${{ vars.API_APP }}
      ACR_SERVER: ${{ vars.ACR_SERVER }}
      RUNTIME_IDENTITY_ID: ${{ vars.RUNTIME_IDENTITY_ID }}
      RUNTIME_CLIENT_ID: ${{ vars.RUNTIME_CLIENT_ID }}
      BLOB_SERVICE_URI: ${{ vars.BLOB_SERVICE_URI }}
      BLOB_CONTAINER: ${{ vars.BLOB_CONTAINER }}
      API_IMAGE: ${{ vars.ACR_SERVER }}/${{ vars.IMAGE_PREFIX }}/api:${{ github.sha }}
      FRONTEND_IMAGE: ${{ vars.ACR_SERVER }}/${{ vars.IMAGE_PREFIX }}/frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate to registry
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"
      - name: Build and push API
        run: |
          docker compose -f compose.yml build api
          docker compose -f compose.yml push api
      - name: Deploy API
        env:
          IMAGE_NAME: ${{ env.API_IMAGE }}
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
        run: python3 scripts/deploy-app.py api
      - name: Check API readiness and capture URL
        id: api_endpoint
        run: |
          for attempt in $(seq 1 60); do
            state=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.provisioningState -o tsv)
            latest=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.latestRevisionName -o tsv)
            ready=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.latestReadyRevisionName -o tsv)
            if [ "$state" = Failed ]; then echo 'Azure provisioning failed'; exit 1; fi
            if [ "$state" = Succeeded ] && [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
              fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.configuration.ingress.fqdn -o tsv)
              if [ -z "$fqdn" ]; then echo 'API ingress URL is missing'; exit 1; fi
              echo "api_base_url=https://$fqdn" >> "$GITHUB_OUTPUT"
              echo "Ready revision: $ready"
              exit 0
            fi
            sleep 10
          done
          echo 'API revision did not become ready; inspect Container Apps logs.'
          exit 1
      - name: Build and push frontend
        run: |
          docker compose -f compose.yml build frontend
          docker compose -f compose.yml push frontend
      - name: Deploy frontend
        env:
          IMAGE_NAME: ${{ env.FRONTEND_IMAGE }}
          API_BASE_URL: ${{ steps.api_endpoint.outputs.api_base_url }}
        run: python3 scripts/deploy-app.py frontend
      - name: Check frontend readiness
        run: |
          for attempt in $(seq 1 60); do
            state=$(az containerapp show -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" --query properties.provisioningState -o tsv)
            latest=$(az containerapp show -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" --query properties.latestRevisionName -o tsv)
            ready=$(az containerapp show -g "$RESOURCE_GROUP" -n "$FRONTEND_APP" --query properties.latestReadyRevisionName -o tsv)
            if [ "$state" = Failed ]; then echo 'Azure provisioning failed'; exit 1; fi
            if [ "$state" = Succeeded ] && [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
              echo "Ready revision: $ready"
              exit 0
            fi
            sleep 10
          done
          echo 'Frontend revision did not become ready; inspect Container Apps logs.'
          exit 1
      # Add application-specific HTTP tests and database checks; revision readiness is not functional testing.
