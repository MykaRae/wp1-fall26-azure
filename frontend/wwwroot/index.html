<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WP1 Service Status</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 42rem; padding: 0 1rem; }
    button { cursor: pointer; padding: 0.5rem 0.8rem; }
    pre { background: #f3f4f6; padding: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>WP1 Service Status</h1>
    <p>This page checks whether the API is responding.</p>
    <button id="check" type="button">Check API</button>
    <pre id="status" role="status" aria-live="polite">Checking API…</pre>
  </main>
  <script>
    const statusElement = document.querySelector("#status");
    const checkButton = document.querySelector("#check");

    async function checkApi() {
      statusElement.textContent = "Checking API…";
      try {
        const response = await fetch("/api/health");
        const result = await response.json();
        if (!response.ok) {
          throw new Error(`API returned HTTP ${response.status}`);
        }
        statusElement.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        statusElement.textContent = `API check failed: ${error.message}`;
      }
    }

    checkButton.addEventListener("click", checkApi);
    checkApi();
  </script>
</body>
</html>
